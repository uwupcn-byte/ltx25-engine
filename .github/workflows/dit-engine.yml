name: dit-engine

# Builds libdit_engine.so (+ Hexagon skels) for LTX-2.5.
#
# Sources are cloned at build time: local-dream at the tag Nightmare ships, its
# pinned stable-diffusion.cpp submodule, and Nightmare's own patch stack (public
# repo) plus ours from patches/ applied last.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  LOCAL_DREAM_REF: v3.0.0-alpha.4
  HEXAGON_TAG: v0.7
  NDK_VERSION: 29.0.14206865
  NIGHTMARE_REF: main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Reclaim disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/powershell /usr/share/swift || true
          sudo apt-get clean
          df -h /

      - name: Checkout this repo (our patches)
        uses: actions/checkout@v4
        with:
          path: ltx25-engine

      - name: Clone local-dream
        run: |
          git clone --depth 1 --branch "$LOCAL_DREAM_REF" https://github.com/xororz/local-dream.git local-dream
          echo "local-dream $(git -C local-dream rev-parse HEAD)"

      - name: Clone nightmare (patch stack)
        run: |
          git clone --depth 1 --branch "$NIGHTMARE_REF" https://github.com/AbrahamPaulJ/nightmare-mobile.git nm
          echo "nightmare $(git -C nm rev-parse HEAD)"
          ls nm/backend-patches/*.patch | wc -l
          ls nm/backend-patches/dit/*.patch | wc -l

      - name: Fetch stable-diffusion.cpp at the pinned revision
        run: |
          cd local-dream
          git submodule update --init --recursive --depth 1 -- app/src/main/cpp/3rdparty/stable-diffusion.cpp
          cd app/src/main/cpp/3rdparty/stable-diffusion.cpp
          git fetch --depth 1 origin 35a3d48b23581d2be7c3ad95e92f34662bb5f305
          git checkout FETCH_HEAD
          git submodule update --init --recursive --depth 1
          echo "SDCPP_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "GGML_SHA=$(git -C ggml rev-parse HEAD)" >> "$GITHUB_ENV"
          test -f docs/ltx2.md && echo "LTX-2.5 docs present" || (echo "::error::no LTX support in this sdcpp"; exit 1)

      - name: Install NDK
        run: |
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --licenses >/dev/null 2>&1 || true
          "$SDK" "ndk;$NDK_VERSION" || "$SDK" --channel=3 "ndk;$NDK_VERSION"
          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          test -d "$NDK" || (echo "::error::NDK did not install"; ls "$ANDROID_HOME/ndk"; exit 1)
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

      - name: Extract the Hexagon SDK
        run: |
          set -euo pipefail
          docker create --name hexsdk ghcr.io/snapdragon-toolchain/arm64-android:$HEXAGON_TAG
          DEST="$RUNNER_TEMP/hexsdk"
          mkdir -p "$DEST"
          docker cp hexsdk:/opt/hexagon - | tar -x -C "$DEST" --no-same-permissions --no-same-owner
          docker rm hexsdk
          chmod -R u+rwX "$DEST"
          MARK=$(find "$DEST" -maxdepth 3 -name setup_sdk_env.source | sort -V | tail -1)
          if [ -n "$MARK" ]; then ROOT=$(dirname "$MARK"); else
            ROOT=$(find "$DEST" -mindepth 2 -maxdepth 2 -type d -name '[0-9]*' | sort -V | tail -1); fi
          test -n "$ROOT" || (echo "::error::no Hexagon SDK root"; exit 1)
          echo "HEXAGON_SDK_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "SDK at $ROOT"; du -sh "$ROOT" || true

      - name: Apply Nightmare's patch stack
        run: |
          set -uo pipefail
          SDCPP=local-dream/app/src/main/cpp/3rdparty/stable-diffusion.cpp
          apply_one() {
            p="$1"
            case "$p" in
              *.ggml.patch)  repo="$SDCPP/ggml"; args="" ;;
              *.sdcpp.patch) repo="$SDCPP"; args="" ;;
              *)             repo=local-dream; args="--directory=app/src/main/cpp" ;;
            esac
            git -C "$repo" add -A -N >/dev/null 2>&1 || true
            if git -C "$repo" apply --3way $args "$p" >/dev/null 2>&1; then
              echo "ok   $(basename "$p")"
              return 0
            fi
            echo "FAIL $(basename "$p")"
            git -C "$repo" apply --3way $args "$p" 2>&1 | head -12 || true
            git -C "$repo" checkout -- . >/dev/null 2>&1 || true
            return 1
          }
          FAILS=0
          OKS=0
          for p in nm/backend-patches/*.patch; do
            if apply_one "$p"; then OKS=$((OKS+1)); else FAILS=$((FAILS+1)); fi
          done
          for p in nm/backend-patches/dit/*.patch; do
            if apply_one "$p"; then OKS=$((OKS+1)); else FAILS=$((FAILS+1)); fi
          done
          echo "PATCH ok=$OKS fail=$FAILS"
          echo "PATCH_FAILS=$FAILS" >> "$GITHUB_ENV"
          git -C local-dream diff --stat | tail -3 || true
          git -C "$SDCPP" diff --stat | tail -3 || true

      - name: Apply our patches
        run: |
          set -euo pipefail
          shopt -s nullglob
          SDCPP=local-dream/app/src/main/cpp/3rdparty/stable-diffusion.cpp
          for p in "$GITHUB_WORKSPACE/ltx25-engine/patches/"*.patch; do
            echo "--- $p"
            case "$p" in
              *.ggml.patch)  repo="$SDCPP/ggml"; args="" ;;
              *.sdcpp.patch) repo="$SDCPP"; args="" ;;
              *)             repo=local-dream; args="--directory=app/src/main/cpp" ;;
            esac
            git -C "$repo" add -A -N
            git -C "$repo" apply -v $args "$p" || (echo "::error::our patch failed: $p"; exit 1)
          done

      - name: Record the ABI version
        run: |
          cd local-dream/app/src/main/cpp
          V=$(grep -o 'DIT_ENGINE_ABI_VERSION[^0-9]*[0-9]*' include/DitEngine.h | grep -o '[0-9]*' | head -1)
          echo "ABI_VERSION=$V" >> "$GITHUB_ENV"
          echo "DIT_ENGINE_ABI_VERSION=$V"

      - name: Build
        run: |
          cd local-dream/app/src/main/cpp
          bash dit/build.sh
          df -h /

      - name: Package
        run: |
          set -euo pipefail
          cd local-dream/app/src/main
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp jniLibs/arm64-v8a/libdit_engine.so "$GITHUB_WORKSPACE/out/"
          cp assets/ditlibs/libggml-htp-v79.so assets/ditlibs/libggml-htp-v81.so "$GITHUB_WORKSPACE/out/" || true
          for V in v73 v75; do
            S=cpp/dit/build/android/sdcpp/ggml/src/ggml-hexagon/libggml-htp-$V.so
            if [ -f "$S" ]; then cp "$S" "$GITHUB_WORKSPACE/out/"; else echo "no $V skel"; fi
          done
          cd "$GITHUB_WORKSPACE/out"
          zip -j -X "dit-engine-abi${ABI_VERSION}.zip" libdit_engine.so
          ls -l

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dit-engine-abi${{ env.ABI_VERSION }}
          path: out/
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-abi${{ env.ABI_VERSION }}
          name: engine abi${{ env.ABI_VERSION }} (build ${{ github.run_number }}, ${{ env.PATCH_FAILS }} patch failures)
          body: LTX-2.5 engine, abi${{ env.ABI_VERSION }}, patch failures ${{ env.PATCH_FAILS }}
          files: out/*.zip
